spring:
  application:
    name: ecommerce-backend

  datasource:
    # 🔥 On utilise une variable d'environnement, avec fallback sur localhost pour le dev local
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    # 🔥 Pareil ici : si on est dans Docker, on utilise "kafka:9092", sinon "localhost:9092"
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 10
        batch.size: 16384
        spring.json.add.type.headers: false
    consumer:
      group-id: ecommerce-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        auto.offset.reset: earliest

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3e1b7a6f5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  # Pour que le container écoute bien sur toutes les interfaces (0.0.0.0)
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}